<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Solar installer redlines by confirmed state coverage and the provided installer redline sheet.">
  <title>Installer Redlines - SolarHelp</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="redlines">
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="/">SolarHelp</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="active" href="/redlines" aria-current="page">Redlines</a>
        <a href="/warehouses-owe">OWE Warehouses</a>
      </nav>
    </div>
  </header>

  <main class="page-shell narrow">
    <div class="page-heading">
      <h1>Installer Redlines</h1>
      <p>Select a state to see only the installers confirmed to operate in that state, together with the redline available in the current rate sheet.</p>
    </div>

    <section class="panel directory-panel">
      <div class="filter-row">
        <label class="field" for="state-select">
          <span>State</span>
          <select id="state-select" aria-describedby="redline-status"></select>
        </label>

        <label class="field" for="installer-search">
          <span>Filter installer</span>
          <input id="installer-search" type="search" placeholder="Installer name">
        </label>
      </div>

      <div id="redline-status" class="directory-status" aria-live="polite"></div>

      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>Installer</th>
              <th>Redline</th>
              <th>Coverage / note</th>
            </tr>
          </thead>
          <tbody id="redline-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/redlines-data.js"></script>
  <script src="/redlines-coverage.js"></script>
  <script src="/data-bridge.js"></script>
  <script src="/script.js"></script>
</body>
</html>
